<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="scripts/analytics.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Doze Teclas | Teclado Virtual</title>
    <link rel="stylesheet" href="css/teclado.css">
</head>
<body>

    <div class="header">
        <a href="index.html" class="back-btn">← VOLTAR</a>
        <span class="header-title">TECLADO VIRTUAL</span>
    </div>

    <div class="piano-card">
        <div class="top-btns">
            <div class="icon-btn" id="btnOpenSettings">
                <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-1.03l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.21.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
            </div>
            <div class="icon-btn" id="btnOpenHelp">?</div>
        </div>

        <div class="piano-viewport" id="viewport">
            <div class="keyboard" id="keyboard"></div>
            <div class="nav-touchpad"></div>
        </div>

        <div class="metro-container">
            <div class="metro-row">
                <button class="circle-btn" id="bpmMinus">−</button>
                <div style="text-align:center">
                    <div class="metro-label">BPM</div>
                    <div id="bpmNum" class="main-val">120</div>
                </div>
                <button class="circle-btn" id="bpmPlus">+</button>
            </div>

            <div class="metro-row">
                <button class="circle-btn" id="sigMinus">−</button>
                <div style="text-align:center">
                    <div class="metro-label">BATIDAS</div>
                    <div id="sigNum" style="font-size:1.3rem; font-weight:800">4</div>
                </div>
                <button class="circle-btn" id="sigPlus">+</button>
            </div>

            <div style="margin-top: 5px;">
                <div class="metro-label" style="font-size: 0.85rem;">Volume Metrônomo</div>
                <input type="range" class="vol-slider" id="metroVol" min="0" max="100" value="50">
            </div>

            <button id="metroPlay" class="btn-play">INICIAR</button>
        </div>
    </div>

    <div id="helpModal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h3>Como Usar</h3>
            <p style="color: var(--text-muted); line-height: 1.6;">Toque nas teclas para produzir som. Arraste a barra inferior para navegar entre as oitavas. Use o metrônomo para praticar seu tempo.</p>
        </div>
    </div>

    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h3>Ajustes de Áudio</h3>
            
            <div class="setting-row">
                <label>Timbre das Teclas</label>
                <select id="timbreSelect">
                    <option value="triangle">Triangular (Suave)</option>
                    <option value="sine">Senoide (Puro)</option>
                    <option value="square">Quadrada (Vintage)</option>
                    <option value="sawtooth">Dente de Serra (Brilhante)</option>
                </select>
            </div>

            <div class="setting-row">
                <label>Volume do Teclado</label>
                <input type="range" class="vol-slider" id="pianoVol" min="0" max="100" value="90">
            </div>
        </div>
    </div>

    <script type="module" src="scripts/teclado.js"></script>
</body>
</html>
