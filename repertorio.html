<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Doze Teclas | Repertório Litúrgico</title>
    <meta name="description" content="Monte e gerencie repertórios para celebrações litúrgicas com cifras do Doze Teclas. Organize por momentos da missa com transposição personalizada.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <meta property="og:site_name" content="Doze Teclas">
    <meta property="og:type" content="website">
    <meta id="og-title" property="og:title" content="Doze Teclas | Repertório Litúrgico">
    <meta id="og-desc" property="og:description" content="Organize celebrações com cifras em cada momento litúrgico. Monte seu repertório com transposição personalizada.">
    <meta property="og:image" content="https://dozeteclas.com.br/assets/banner-padrao.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="canonical" href="https://dozeteclas.com.br/repertorio.html">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/repertorio.css">
    <script src="scripts/analytics.js"></script>
    <script src="scripts/meta.js" defer></script>
</head>
<body>
    <header class="repertorio-header">
        <div class="header-container">
            <a href="javascript:void(0);" id="btn-back-minimal" class="btn-voltar" onclick="history.back()">&larr; Voltar</a>
            <span class="header-brand">Repertório</span>
            <button type="button" id="btn-theme-toggle" class="theme-toggle-btn" title="Alternar tema" aria-label="Alternar tema">
                <i class="bi bi-toggle-off" id="theme-toggle-icon"></i>
            </button>
        </div>
    </header>
<main class="repertorio-main" id="repertorio-main">
        <section id="section-lista" class="section-panel">
            <div class="section-header">
                <h1 class="section-title">&#128203; Minhas Celebra&ccedil;&otilde;es</h1>
                <button id="btn-nova-celebracao" class="btn-primary"><i class="bi bi-plus-lg"></i> Nova</button>
            </div>
            <div id="lista-celebracoes" class="lista-celebracoes">
                <div class="loading-placeholder">Carregando celebra&ccedil;&otilde;es...</div>
            </div>
        </section>
        <section id="section-editor" class="section-panel" style="display:none;">
            <div class="section-header">
                <button id="btn-voltar-lista" class="btn-back-editor"><i class="bi bi-arrow-left"></i> Voltar</button>
                <h2 id="editor-titulo" class="section-title">Nova Celebra&ccedil;&atilde;o</h2>
                <button id="btn-salvar-celebracao" class="btn-primary btn-save"><i class="bi bi-check-lg"></i> Salvar</button>
            </div>
            <div class="celebration-meta">
                <div class="form-group"><label for="input-titulo">T&iacute;tulo da Celebra&ccedil;&atilde;o</label><input type="text" id="input-titulo" class="form-input" placeholder="Ex: Missa do 10&ordm; Domingo do TC" maxlength="100"></div>
                <div class="form-group"><label for="input-data">Data</label><input type="date" id="input-data" class="form-input"></div>
            </div>
            <div class="momentos-grid" id="momentos-grid"></div>
        </section>
    </main>
<div id="modal-busca" class="modal-overlay" style="display:none;">
        <div class="modal-content modal-search">
            <div class="modal-header"><h3>Buscar Cifra</h3><button class="modal-close" id="btn-fechar-busca">&times;</button></div>
            <div class="modal-search-input-group"><i class="bi bi-search"></i><input type="text" id="input-busca-cifra" class="form-input" placeholder="Digite o t&iacute;tulo da m&uacute;sica..." autocomplete="off"></div>
            <div id="resultados-busca" class="resultados-busca"><p class="busca-placeholder">Digite ao menos 2 caracteres para buscar...</p></div>
        </div>
    </div>
    <div id="modal-confirmacao" class="modal-overlay" style="display:none;">
        <div class="modal-content modal-confirm">
            <div class="modal-header"><h3 id="confirm-titulo">Confirmar</h3></div>
            <p id="confirm-mensagem" class="confirm-mensagem">Tem certeza?</p>
            <div class="confirm-actions"><button id="btn-confirm-cancel" class="btn-secondary">Cancelar</button><button id="btn-confirm-ok" class="btn-danger">Confirmar</button></div>
        </div>
    </div>
    <div id="modal-texto" class="modal-overlay" style="display:none;">
        <div class="modal-content modal-texto">
            <div class="modal-header"><h3>Texto / Observa&ccedil;&atilde;o</h3><button class="modal-close" id="btn-fechar-texto">&times;</button></div>
            <div class="form-group"><label for="input-texto-titulo">T&iacute;tulo</label><input type="text" id="input-texto-titulo" class="form-input" placeholder="Ex: Leitura da Ora&ccedil;&atilde;o" maxlength="100"></div>
            <div class="form-group"><label for="input-texto-conteudo">Conte&uacute;do</label><textarea id="input-texto-conteudo" class="form-textarea" rows="4" placeholder="Digite o texto ou observa&ccedil;&atilde;o..."></textarea></div>
            <div class="confirm-actions"><button id="btn-cancelar-texto" class="btn-secondary">Cancelar</button><button id="btn-salvar-texto" class="btn-primary">Salvar</button></div>
        </div>
    </div>
    <footer class="repertorio-footer"><p>Doze Teclas &copy; 2026 &mdash; Repert&oacute;rios salvos localmente no navegador</p></footer>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="scripts/supabase-db.js" defer></script>
    <script src="scripts/theme-toggle.js" defer></script>
    <script type="module" src="scripts/repertorio.js"></script>
</body>
</html>
