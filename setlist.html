<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Doze Teclas | Setlist ao Vivo</title>
    <meta name="description" content="Modo execução ao vivo do repertório litúrgico. Navegue entre as músicas da celebração com transposição personalizada.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <meta property="og:site_name" content="Doze Teclas">
    <meta property="og:type" content="website">
    <meta id="og-title" property="og:title" content="Doze Teclas | Setlist ao Vivo">
    <meta id="og-desc" property="og:description" content="Modo execução ao vivo para celebrações litúrgicas com cifras transpostas.">
    <meta property="og:image" content="https://dozeteclas.com.br/assets/banner-padrao.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="canonical" href="https://dozeteclas.com.br/setlist.html">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=Source+Code+Pro:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/setlist.css">
    <link rel="stylesheet" href="css/print.css" media="print">
    <script src="scripts/analytics.js"></script>
    <script src="scripts/meta.js" defer></script>
</head>
<body class="setlist-body">
    <header class="setlist-header" id="setlist-header">
        <div class="setlist-nav">
            <button id="btn-ant" class="setlist-nav-btn" title="Anterior"><i class="bi bi-chevron-left"></i> Anterior</button>
            <div class="setlist-nav-center">
                <span id="setlist-titulo" class="setlist-titulo">Carregando...</span>
                <span id="setlist-musica-titulo" class="setlist-musica-titulo"></span>
                <span id="setlist-momento" class="setlist-momento-badge"></span>
                <span id="setlist-progresso" class="setlist-progresso">1/1</span>
            </div>
            <button id="btn-prox" class="setlist-nav-btn" title="Próxima">Próxima <i class="bi bi-chevron-right"></i></button>
        </div>
        <div class="setlist-subnav">
            <button id="btn-drawer" class="setlist-subnav-btn" title="Roteiro"><i class="bi bi-list-ol"></i> Roteiro</button>
            <button id="btn-fullscreen" class="setlist-subnav-btn" title="Tela cheia"><i class="bi bi-arrows-fullscreen"></i></button>
            <button id="btn-theme-toggle-setlist" class="setlist-subnav-btn" title="Alternar tema"><i class="bi bi-toggle-off" id="theme-toggle-icon-setlist"></i></button>
            <a href="repertorio.html" class="setlist-subnav-btn" title="Voltar ao repertório" style="text-decoration:none;"><i class="bi bi-box-arrow-left"></i></a>
        </div>
    </header>
    <main class="setlist-main" id="setlist-main">
        <div id="setlist-content" class="setlist-content">
            <div class="setlist-loading">Carregando repertório...</div>
        </div>
    </main>
    <div id="drawer-overlay" class="drawer-overlay" style="display:none;"></div>
    <div id="drawer" class="drawer" style="display:none;">
        <div class="drawer-header">
            <h3 class="drawer-title">Roteiro da Celebração</h3>
            <button id="btn-fechar-drawer" class="drawer-close">&times;</button>
        </div>
        <div id="drawer-body" class="drawer-body">
            <div class="drawer-loading">Carregando...</div>
        </div>
    </div>

    <!-- ==========================================================
         BARRA DE FERRAMENTAS FLUTUANTE (Modo Palco)
         Espelha as mesmas ferramentas do cifra.html
         ========================================================== -->
    <div class="header-tools" id="setlist-tools">
        <div class="tools-wrapper">
            <button class="btn-tool" id="btn-setlist-zoom-out" title="Diminuir fonte">A-</button>
            <button class="btn-tool" id="btn-setlist-zoom-reset" title="Tamanho original">100%</button>
            <button class="btn-tool" id="btn-setlist-zoom-in" title="Aumentar fonte">A+</button>
            <button class="btn-tool" id="btn-setlist-toggle-txt" title="Modo apenas texto">G7</button>
            <button class="btn-tool" id="btn-setlist-acc" title="Alternar acidentes (sustenido/bemol)">#</button>
            <button class="btn-tool" id="btn-setlist-columns" title="Alternar Colunas">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="vertical-align: middle;">
                    <path d="M6.8 3H6.2C5.0799 3 4.51984 3 4.09202 3.21799C3.71569 3.40973 3.40973 3.71569 3.21799 4.09202C3 4.51984 3 5.07989 3 6.2V17.8C3 18.9201 3 19.4802 3.21799 19.908C3.40973 20.2843 3.71569 20.5903 4.09202 20.782C4.51984 21 5.0799 21 6.2 21H6.8C7.9201 21 8.48016 21 8.90798 20.782C9.28431 20.5903 9.59027 20.2843 9.78201 19.908C10 19.4802 10 18.9201 10 17.8V6.2C10 5.0799 10 4.51984 9.78201 4.09202C9.59027 3.71569 9.28431 3.40973 8.90798 3.21799C8.48016 3 7.9201 3 6.8 3Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M17.8 3H17.2C16.0799 3 15.5198 3 15.092 3.21799C14.7157 3.40973 14.4097 3.71569 14.218 4.09202C14 4.51984 14 5.0799 14 6.2V17.8C14 18.9201 14 19.4802 14.218 19.908C14.4097 20.2843 14.7157 20.5903 15.092 20.782C15.5198 21 16.0799 21 17.2 21H17.8C18.9201 21 19.4802 21 19.908 20.782C20.2843 20.5903 20.5903 20.2843 20.782 19.908C21 19.4802 21 18.9201 21 17.8V6.2C21 5.0799 21 4.51984 20.782 4.09202C20.5903 3.71569 20.2843 3.40973 19.908 3.21799C19.4802 3 18.9201 3 17.8 3Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            <button class="btn-tool" id="btn-setlist-print" title="Imprimir / PDF">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" style="vertical-align: middle;">
                    <path fill="#ffffff" d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- ==========================================================
         AUTO-SCROLL FLUTUANTE (Rolagem Automática)
         ========================================================== -->
    <div id="auto-scroll-container" class="auto-scroll-container">
        <div id="speed-slider-container" class="speed-slider-container">
            <input type="range" id="speed-slider" class="speed-slider" min="2" max="100" value="30" orient="vertical">
        </div>
        <button id="auto-scroll-btn" class="auto-scroll-btn" title="Rolagem Automática">
            <i class="bi bi-play-fill" id="auto-scroll-icon"></i>
        </button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="scripts/supabase-db.js" defer></script>
    <script src="scripts/chordpro-parser.js" defer></script>
    <script src="scripts/music-engine.js" defer></script>
    <script src="scripts/auto-scroll.js" defer></script>
    <script type="module" src="scripts/setlist.js"></script>
</body>
</html>
