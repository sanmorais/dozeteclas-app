            </div>
            <div class="brand-text">DOZE<span style="color:white">TECLAS</span></div>
            
            <form id="login-form" style="display: flex; flex-direction: column; width: 100%; gap: inherit; align-items: center;">
                <input type="email" id="login-email" placeholder="E-mail" autocomplete="username" required>
                <input type="password" id="login-password" placeholder="Senha" autocomplete="current-password" required>
                <button type="submit" class="btn-action">ENTRAR</button>
            </form>
        </div>
    </div>

    <div class="sidebar">
        <label>Título</label>
        <input type="text" id="song-title">
        
        <label>Artista</label>
        <input type="text" id="artist-name">
        
        <div style="display: flex; gap: 10px;">
            <div style="flex:1; display:flex; flex-direction:column;">
                <label>Tom</label>
                <select id="song-key">
                    <option value="C">C</option><option value="Db">Db</option><option value="D">D</option>
                    <option value="Eb">Eb</option><option value="E">E</option><option value="F">F</option>
                    <option value="Gb">Gb</option><option value="G">G</option><option value="Ab">Ab</option>
                    <option value="A">A</option><option value="Bb">Bb</option><option value="B">B</option>
                </select>
            </div>
            <div style="flex:1; display:flex; flex-direction:column;">
                <label>BPM</label>
                <input type="number" id="song-bpm">
            </div>
        </div>

        <div class="control-group">
            <label for="txt-slug">Link amigável:</label>
            <input type="text" id="txt-slug" placeholder="link-da-url" />
        </div>

        <label>Link de Referência</label>
        <input type="text" id="song-ref">
        
        <label>Tags / Notas</label>
        <textarea id="song-patch" class="sidebar-area" rows="3" placeholder="adoracao, comunhao, louvor..."></textarea>
        
        <button class="btn-action" id="btn-save-song">SALVAR NO ACERVO</button>
        <button class="btn-tool" id="btn-reset-editor">LIMPAR / NOVA</button>
        <button id="delete-btn" class="btn-danger">EXCLUIR PERMANENTEMENTE</button>

        <div style="margin-top:20px; border-top:1px solid #333; padding-top:15px;">
            <label>PESQUISAR NO ACERVO</label>
            <input type="text" id="acervo-search" placeholder="Busque título ou artista...">
            <div id="songs-container"></div>
        </div>
    </div>

    <div class="editor-main">
        <div class="tools-container">
            <div class="toolbar-row" style="gap:10px;">
                <input type="text" id="replace-search" placeholder="Localizar..." style="flex:3">
                <button class="btn-tool" id="btn-find-first">LOCALIZAR</button>
                <button class="btn-tool" id="btn-find-next">PRÓXIMA</button>
            </div>
            
            <div class="toolbar-row" style="margin-top: 8px; gap:10px;">
                <input type="text" id="replace-dest" placeholder="Substituir por..." style="flex:3">
                <button class="btn-tool" id="btn-replace-single">SUBSTITUIR</button>
                <button class="btn-tool" id="btn-replace-all">SUBSTITUIR TODOS</button>
                <button id="btn-magic-convert" type="button" class="btn-tool2">⚡</button>
            </div>

            <div class="toolbar-row" style="margin-top: 10px; gap:15px; border-top: 1px solid #333; padding-top: 10px;">
                <label>TRANSPOSIÇÃO:</label>
                <button class="btn-tool" id="btn-tone-down">-1 SEMITOM</button>
                <button class="btn-tool" id="btn-tone-up">+1 SEMITOM</button>
            </div>
        </div>
        
        <div class="smart-bar" id="smart-bar"></div>
        <textarea id="main-editor" spellcheck="false" placeholder="Digite sua cifra aqui..."></textarea>
    </div>

    <div class="preview-panel" style="display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; overflow: hidden;">
        <div id="preview-header" style="padding: 101px 20px 80px 20px; flex-shrink: 0;">
            <h1 id="view-title" style="margin: 0;">TÍTULO DA CANÇÃO</h1>
            <h2 id="view-artist" style="margin: 5px 0 10px 0;">ARTISTA</h2>
            <div id="view-meta"></div>
        </div>
        
        <div id="preview-output" class="preview-content" style="flex: 1; overflow-y: auto; margin-top: 0; padding: 0 20px 20px 20px;"></div>
    </div>

    <script src="scripts/supabase-db.js"></script>
    <script src="scripts/music-engine.js"></script>
    <script src="scripts/chordpro-parser.js"></script>
    <script type="module" src="scripts/editor-controls.js"></script>
</body>
</html>
